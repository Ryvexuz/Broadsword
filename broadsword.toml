# broadsword.toml
# All limits and paths live in this one file. Change a value here and every
# agent picks it up. Nothing is hard-coded anywhere else.

root = "."                 # everything is relative to this folder
disk_floor_gb = 20         # pause and clean up below this much free space
cleanup_every_hours = 1
scratch_max_age_hours = 24
max_agents = 30             # working coders only: running tasks waiting in the merge queue do not count; blocked or stale entries count because their coder must act. 30 is a ceiling, with the RAM and CPU rules deciding below it.
max_queued = 30             # task start refuses while this many merge-queue entries (any project) are open, so unmerged work cannot pile up
queue_entry_read_wait_ms = 2000  # task start re-reads (with backoff) a queue entry file that is unreadable or incomplete for at most this long, then fails loudly: queue writes take milliseconds (atomic rename; on Windows a read can briefly hit a sharing violation or an antivirus hold), so 2 s is far above a real write and short next to task_lock_wait_seconds, since start holds the board meanwhile

# S10 (2026-11-23 00:07Z): "After 3 ORCH STALL lines scratch/tick-loop.ps1 calls scripts/restart-orch.ps1 (once per 2 h) instead of waiting for Lazlo"
stall_restart_lines = 3
stall_restart_timeout_seconds = 60
ready_lint_args = "--max-lines 30 --max-bullets 8 --max-files 2 --max-done-lines 10 --min-hard-cases 2 --big-file-lines 1000"
stale_claim_hours = 4 # scripts/stale_claims.py: a running task with no commit or worktree change for this many hours is reported (report only)
# auto-agent (scripts/auto_agent.py, read only by it): the tick starts an overdue process audit / batch review itself
auto_agent_timeout_minutes = 90       # a run still going after this is killed (process tree) and logged as timeout
auto_agent_min_gap_minutes = 150      # no new start of the same job within this many minutes of its last start
auto_agent_max_starts_per_day = 6     # per job, per UTC day; a cap reached prints one line and starts nothing

# Paths, relative to root
scratch_dir = "scratch"    # temp files, logs, test output; can be wiped at any time
build_dir = "build"        # the one shared build folder (CARGO_TARGET_DIR)
projects_dir = "projects"  # each folder here with a Cargo.toml is a project (its own repo, git-ignored)
state_dir = "state"        # durable job records (state/jobs/*.rec); never cleaned up, git-ignored

# Resource monitor
disk_check_every_seconds = 60   # how often `broadsword watch` checks free space
log_max_mb = 50                 # *.log files in scratch are cut to their last N MB
ram_warn_percent = 90           # status warns above this RAM use
cpu_warn_percent = 90           # status warns above this CPU use
sweep_older_than_days = 7       # `cleanup` (and the cleanup a low-disk kill runs) runs `cargo sweep --time N`: build-folder files unused for N days are swept
alert_command = ""              # shell command run with the alert message as its argument; empty = none

# Job runner (broadsword build | test | check)
job_disk_reserve_gb = 2         # a job will not start if free space minus this would be below disk_floor_gb
job_disk_poll_seconds = 5       # while a job runs, free space is checked this often; below the floor kills the job and pauses

# Recovery (broadsword run | recover): only `run` jobs take a checkpoint, refs/broadsword/checkpoints/<job id>; records live in state_dir
checkpoint_ignored_max_mb = 50  # a `run` job's checkpoint also saves git-ignored files up to this many MB; the rest are listed as skipped (build, scratch, state and `target` folders are never saved). Secret files (`.env`, `.envrc`, `.env.<name>`, names starting with `.env-` or `.env_`, any case, and an NTFS short name or stream of one; not `.envoy.yaml` or `.environment`) are NEVER saved or touched by a checkpoint or rollback, whatever this says, and recover names each one it leaves alone; build, test and check take no checkpoint
recover_lock_wait_seconds = 5   # `recover` waits at most this long for state/recover.lock, then says another recover is in progress
max_resumes = 3                 # an interrupted build/test/check is resumed at most this many times in a row, then marked failed

# Stable binary and MCP (broadsword install | broadsword mcp)
install_dir = "build/bin"       # `broadsword install` copies the running binary here (broadsword.exe); the MCP server and the pause hook run this copy, so rebuilding never hits a locked file. Inside root; not inside scratch or state
mcp_call_timeout_seconds = 1800 # an MCP tools/call that runs longer is killed (its whole process tree) and returns an error
mcp_output_max_kb = 1024        # an MCP tools/call keeps at most the last N KB of stdout and of stderr, and says when it cut

# Task board (broadsword task ...): claims and who runs what, in state_dir/tasks
task_lock_wait_seconds = 10     # a task command waits at most this long for the board lock (state/tasks/board.lock), then exits 4 "board busy"
task_archive_days = 30          # move ended board tasks older than this many days into the archive

# Worktrees (broadsword task start --worktree | broadsword worktree ...): one Git worktree per task at <worktrees_dir>/<project>/<task id>, on branch task/<task id>
worktrees_dir = "worktrees"     # inside root; not inside scratch, build or state (a worktree holds unmerged work). Git-ignored. After moving the project run `broadsword worktree repair`

# Shared build folder (build|test|check --task): state/build-sources/<package> notes which checkout last built each package into build_dir; state/build.lock makes "clean the package, record the source, build" one step across processes
build_lock_wait_seconds = 900   # a build/test/check job holds the build lock while cargo compiles (the test step releases it once its test executables are copied to scratch, and runs the tests from the copies); a `run` holds it to its end; a second job waits at most this long, then is refused with exit 3 "build folder busy" having built and cleaned nothing. Sized to outlast one long `check`

# Reviewer step and merge queue (broadsword queue ...): entries live in state_dir/queue
reviewer_backend = "claude"        # which backend reviews a queued branch. Only "claude" exists (Claude Code CLI, headless); an "openai" one can be added later
reviewer_cli = "claude"            # the CLI program, resolved on PATH. A machine-specific path goes in the env var BROADSWORD_REVIEWER_CLI (never in this file). The resolved path is printed and recorded on every review. The override must point OUTSIDE the project root (like the real Claude install) or inside scratch_dir (a TEST HOOK: loudly announced, and the review is marked test_hook: true); any other path inside the root, build/ included, is refused so the shipped fake reviewer can never be used by accident
reviewer_model_low = "haiku"       # reviewer for `queue add --risk low` (cheap first pass, ~$0.006 per review in the benchmark)
reviewer_model_high = "opus"       # reviewer for `queue add --risk high`: deletion, locks, secrets, safety guards (~$0.18 per review). Must differ from the entry's --coder, or the fallback below is used
reviewer_model_high_fallback = "sonnet"  # reviewer for a `--risk high` entry whose --coder is the reviewer_model_high family (Opus-coded work); it too must differ from the coder, or the entry is blocked
reviewer_model_high_gpt = "gpt-6.1-sol"  # gating reviewer of a `--risk high` entry whose --coder is the reviewer_model_high family (Opus-coded work): an OpenAI model asked through clients/openai_review.py, so it is under the same $20/day cap and ledger as the shadow review (the shadow is skipped then). A SKIPPED call (cap reached, GPT unavailable, error, timeout, another model answering) falls back to reviewer_model_high_fallback in the same run. "off" = no GPT gate
reviewer_effort_high = "high"      # `--effort` of the `--risk high` gating call (low, medium, high, xhigh or max); a low-risk call passes no flag
reviewer_timeout_seconds = 900     # a reviewer call that runs longer is killed and the entry is `blocked` (no verdict, nothing merged)
reviewer_diff_max_kb = 400         # a diff bigger than this is never sent to a reviewer (the entry is `blocked`: split the task)
reviewer_brief_max_kb = 32         # `queue add --brief <file>` refuses a bigger file
reviewer_check_tail_kb = 16        # how much of the END of the check output goes into the review prompt
queue_lock_wait_seconds = 5        # a queue command waits at most this long for a queue lock (state/queue/queue.lock, held for a whole `queue run`; state/queue/entries.lock, held for milliseconds), then exits 4 "queue busy"
reviewer_max_calls_per_entry = 3   # the most reviewer calls (every real call counts: retries, resumes, re-runs) one queue entry may make; at the cap the entry is `blocked` ("review call cap reached")
merge_train_max = 4                # `queue run --all` MERGE TRAIN: up to this many review-PASSed entries of one project with non-overlapping claims are merged together: their branches are chained, ONE check runs on the chain tip, one fast-forward, one main check (a failure is bisected). 1 = off (every entry is checked, merged and main-checked on its own, exactly as before). Trial (Lazlo 2026-11-19): shipped 4; set 1 to revert
merge_train_wait_minutes = 20      # a project whose oldest approved entry has waited this long gets a (short) train at the next entry boundary even while more of its entries are queued; a project with no entry left to run gets one at once
merge_train_lanes = 2              # Check claim-disjoint trains concurrently, stacking each lane on the previous tip so the merged tip is exactly a checked commit. Projects with a perf baseline stay serial. Revert: set 1
review_parallel = 3                # `queue run --all` with the merge train on (merge_train_max > 1): up to this many entries are brought to their review verdict AT ONCE (PARALLEL REVIEW in queue.rs): each entry's preconditions, rebase and done check run one entry after another in queue order, the gate (and shadow) reviews run side by side, every GPT call (gate or shadow) one at a time so the daily cap is checked per call as before; trains, train checks, fast-forwards and main checks stay serial, in queue order. Ignored with the train off. 1 = one entry at a time, exactly as before. Trial (Lazlo 2026-11-22): shipped 3; set 1 to revert if merges per hour do not rise
perf_gate = "on"                   # queue PERF GATE: after a check passes, a project with a baseline (state/perf/<project>-baseline.json) runs its bench (`cargo run --release --offline --example bench -- --runs <runs_per_case>`) on the checked commit; a case whose median is slower than its baseline's threshold_pct fails the entry `perf_failed`. A train runs it once on the tip (a failure is bisected like the check). A project without a baseline is skipped (logged); a baseline that exists but cannot be used FAILS. "off" runs no bench
perf_runs = 5                      # the perf gate runs the bench this many times per checked commit (each under the build lock); each case is judged on the median of the runs' medians
queue_per_project = "on"           # SCALING F2: "on" gives every project its own run lock (state/queue/<project>.queue.lock), so `queue run --project <p>` drivers of different projects run at once, a second driver of one project exits 4, and `queue run` needs --project or --entry; the entries lock stays global. "off" = one global state/queue/queue.lock, exactly as before. Revert: set "off"
queue_auto_revert = "on"           # a main check that fails after a queue merge: "on" reverts exactly the merged commits on the trunk (git revert, never a reset), checks main again, and holds the lane (state/queue/hold-<project>) if that fails; "off" = report only, exactly as before
queue_main_check_async = "on"      # train main checks run in the background; the next fast-forward and the drain's end wait and settle (including auto-revert). Revert: set off
main_full_check_every_minutes = 60 # 0 = every main check is the full check (the revert)
merge_fast_tests = "broadsword: queue tasks wtgit buildsrc recovery secrets checkpoint_secret mcp"  # the merge queue's PRE-merge check (single entry and merge-train tip) for each project named here is ONE `run` job, `cargo build --offline && cargo test --offline [--lib] [--bins] --test <name> ...` (the unit-test flags the packages have, from cargo metadata; unreadable = the full check) (same disk guard, build lock, log, scrubbed env), instead of the full `check`; the main check after the merge is always the full `check`, and queue_auto_revert (required "on" when this is not "") reverts a merge whose full check fails. "<project>: <test binary> ...; <project>: ..."; every name must be a test target (kind "test") that `cargo metadata` lists for the packages cargo tests, checked at each pre-merge check on the commit being checked: an unknown name refuses that check (check_failed, nothing runs), and when cargo metadata cannot run or be read the FULL check runs instead; "" = every project runs the full check before a merge. Shipped: the merge, task/claim, git, build-guard, recovery and secret tests; measured 2026-11-22 in the t-20261122-052339-2 worktree: the subset (cargo build + cargo test --bins and the 7 binaries) 278 s wall vs one full `broadsword check broadsword` 1156 s wall (775 cargo tests + 33 Python scripts). Revert to "" if merges/h do not rise or a broken commit stays on main
python_tests = "broadsword: scripts/test_move_check.py scripts/test_backup_status.py scripts/test_baseline.py scripts/test_baseline_extras.py scripts/test_brief_lint.py scripts/test_check_ci_workflow.py scripts/test_cold_move.py scripts/test_dev_metrics.py scripts/test_fresh_clone_check.py scripts/test_ledger_check.py scripts/test_main_provenance.py scripts/test_node_check.py scripts/test_roadmap_status.py scripts/test_session_end_check.py scripts/test_shadow_adjudicate.py scripts/test_shadow_canary.py scripts/test_shadow_report.py scripts/test_slot_check.py scripts/test_usage_sum.py clients/test_codex_coder.py clients/test_openai_mcp.py clients/test_openai_review.py bench/coder/test_openai_provider.py bench/coder/test_provider_errors.py bench/coder/test_run_attempts.py bench/coder/test_run_regrade.py bench/coder/test_run_timeout.py bench/drift/test_drift.py bench/instruct/test_instruct.py bench/reviewer/test_replay.py bench/reviewer/test_run_codex.py bench/reviewer/test_run_openai.py bench/reviewer/test_score_hard.py scripts/test_review_dispute.py scripts/test_hotspots.py scripts/test_wake_on_event.py scripts/test_stall_restart.py scripts/test_stale_claims.py scripts/test_readiness.py"  # SCALING F9: the Python test scripts `test` and `check` run after cargo's tests passed, per project: "<project>: <script> <script> ...; <project>: ...". Each runs as `python -I -B <script>` in the project folder (the task's worktree with --task), with the same disk guard, log, job record, scrubbed environment and exit codes; the first failure fails the job. A project with no Python tests is left out of the list ("" = no project has any); the key itself is required. scripts/test_archive_evidence.py is left out: it fails on main (2026-11-20, it looks for secret_name in reviewer.rs, which moved to scrub.rs). Also left out (orchestrator base-commit runs): bench/coder/test_harness_forge.py needs the real cargo route and must never run inside another broadsword job (hung over 20 minutes inside `broadsword run`).
bash_projects = "broadsword"  # which projects' queue checks need bash on PATH (the score_hard bench test runs make_diff.sh with bash); `queue run` of a listed project's lane refuses, exit 2, when bash is not on PATH or does not run; "" = none. Revert: set "".
done_check_timeout_seconds = 1200  # merge queue DONE CHECK (donecheck.rs): each brief done-check command the queue runs (`broadsword build <project> --task <id>`, `broadsword run <project> --task <id> -- ...`; test and check lines are COVERED by the queue's own check, never run again) is killed with its whole process tree after this long, and the entry is `rejected`. Above build_lock_wait_seconds, so a command waiting for the build lock is refused (blocked) before it is killed
done_check_tail_lines = 60        # merge queue DONE CHECK: the last N lines of each command's output (and at most reviewer_check_tail_kb of them) go into the review prompt and state/queue/<entry>.donecheck
test_parallel_binaries = 1      # the test step (test, check) runs up to this many copied test executables, and then the project's Python tests, at once; outputs print whole in cargo's order then the declared script order, one summed summary line; any failure fails the job and starts nothing new. 1 = one after another, streamed (the old serial path, unchanged). Shipped 1 (2026-11-20, t-20261120-174501): a full broadsword test took 757 s at 1 and 446-596 s at 4, but 4 is not proven yet: at 4, tests/queue.rs's wall-clock budgets timed out in 3 of 5 runs (each child ran about 2.5x slower beside three others); those budgets were raised since (d523c04, WAIT_CEILING_FACTOR = 5) and no full run at 4 has been made on top of that. Recovery kills every pid in child_pids, so a value above 1 is safe to trial
test_output_wait_seconds = 10    # side by side (test_parallel_binaries above 1), a test child that has exited has its output pipes waited for at most this long: a process it started may keep them open. Then its output is printed as far as it got, marked TRUNCATED, and the pool goes on; the wait never stops the disk-floor poll or the other children
python_parallel = 4             # with test_parallel_binaries = 1, run this many Python scripts at once AFTER cargo's tests and doc-tests pass; scripts never run beside cargo's tests in this mode. Before (brief, 2026-11-23/24): Python median 421.6 s, full check median 1205 s. After: not measured yet; target Python 110-160 s, full check 900-950 s. Revert: set 1 (also revert on parallel-only script failures or if Python time does not fall 40%).
redact_min_chars = 6             # a .env or secret-named value shorter than this many characters is not redacted from text (it would blank ordinary words); it is still kept out of every child's environment
# Shadow second reviewer (queue run): a second model reviews the same prompt and is only RECORDED, never gating. Program: clients/openai_review.py under the Python on PATH (-I -B); the key comes from the root .env
shadow_reviewer = "openai"          # "openai" runs the shadow review after the gating review; "off" disables it. Back on 2026-11-19 after the sandbox fix 178cae0: scripts/shadow_canary.py from main passed on gpt-5.6-sol and gpt-6.1-sol (codex is offered no tools); re-run it after every codex update
shadow_reviewer_model = "gpt-6.2-sol"  # the OpenAI model that shadow-reviews (Lazlo 2026-11-19: shadows are gpt-6.1-sol, gpt-6.2-astra, gpt-6.2-sol; one model until the multi-shadow task lands). Switched 2026-11-21 to measure 6.2 as a shadow; switch back to gpt-6.1-sol if its precision over 20 shadow reviews is below gpt-6.1-sol's (state/staging/reviewer-patterns)
shadow_reviewer_timeout_seconds = 300  # a shadow call that runs longer is killed and recorded as shadow_verdict = ERROR; the merge goes on
# Codex coder route (clients/codex_coder.py): a GPT coder through `codex exec`, confined to the task's worktree
codex_coder_timeout_seconds = 1800  # the whole codex run (one coding task) is killed, with its process tree, after this; its changes are still listed and judged. 1800 = mcp_call_timeout_seconds; above a subagent's 600 s shell limit, so the orchestrator runs it in the background (.claude/agents/coder-codex.md)
hotspot_lines = 1500            # scripts/hotspots.py: a file with more lines than this is a split candidate
hotspot_window_hours = 48        # scripts/hotspots.py: the default look-back window for commits and board tasks (--hours overrides)
hotspot_wait_hours = 1           # scripts/hotspots.py: a file whose tasks waited this many task-hours on a held claim is hot (whole hours)
hotspot_claims = 5               # scripts/hotspots.py: a file claimed by this many tasks in the window is hot
hotspot_commits = 5              # scripts/hotspots.py: a file with this many commits on the trunk in the window is hot
